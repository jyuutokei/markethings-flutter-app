name: mt
description: E-commerce app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_native_splash: ^2.4.8
  device_preview_plus: ^2.9.1
  talker_flutter: ^5.1.20
  supabase_flutter: ^2.17.2
  supabase_auth_ui: ^0.7.0
  go_router: ^18.0.0
  get_it: ^9.2.1
  skeletonizer: ^2.1.3
  envied: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0
  build_runner: ^2.16.0
  envied_generator: ^1.3.8

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400